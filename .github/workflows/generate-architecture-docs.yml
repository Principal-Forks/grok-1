name: Generate Architecture Documentation

on:
  push:
    paths:
      - '.principal-views/**'
  pull_request:
    paths:
      - '.principal-views/**'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    name: Generate Principal View Documentation
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Principal View CLI
        run: npm install -g @principal-ai/principal-view-cli
        
      - name: Validate Principal View Configuration
        run: |
          echo "🔍 Validating Principal View configuration..."
          npx @principal-ai/principal-view-cli validate
          echo "✅ Configuration is valid"
          
      - name: List Canvas Files
        run: |
          echo "📋 Found canvas files:"
          npx @principal-ai/principal-view-cli list
          
      - name: Generate Architecture Overview
        run: |
          echo "🏗️  Generating architecture documentation..."
          mkdir -p docs/architecture
          
          # Create markdown documentation
          cat > docs/architecture/README.md << 'EOF'
          # Grok-1 Architecture Overview
          
          This document is automatically generated from Principal View configuration.
          
          ## Architecture Components
          
          The Grok-1 model consists of the following key components:
          
          ### Core Model
          - **Language Model**: 314B parameter Mixture of Experts (MoE) architecture
          - **Transformer Layers**: 64 layers with multi-head attention
          - **MoE Layer**: 8 experts, 2 active per token
          - **Attention**: 48 query heads, 8 key/value heads with rotary embeddings
          
          ### Data Processing
          - **Tokenizer**: SentencePiece tokenizer with 131K vocabulary
          - **Checkpoint**: Model weights storage with 8-bit quantization support
          
          ### Execution
          - **Inference Runner**: JAX-based inference execution
          - **Model Output**: Generated text responses
          
          ## Data Flow
          
          1. User input is tokenized using SentencePiece
          2. Tokens flow through the Grok-1 language model
          3. Model processes through 64 transformer layers
          4. Each layer uses attention mechanisms and MoE routing
          5. Final output is generated through JAX inference runner
          
          ## Technical Specifications
          
          - **Parameters**: 314 billion
          - **Architecture**: Mixture of 8 Experts (MoE)
          - **Experts per Token**: 2
          - **Layers**: 64
          - **Attention Heads**: 48 for queries, 8 for keys/values
          - **Embedding Size**: 6,144
          - **Maximum Sequence Length**: 8,192 tokens
          - **Framework**: JAX with Haiku
          - **Quantization**: 8-bit supported
          EOF
          
      - name: Generate Canvas Visualization Data
        run: |
          echo "🎨 Processing canvas visualization data..."
          
          # Extract and format node information
          nodejs -e "
          const fs = require('fs');
          const canvas = JSON.parse(fs.readFileSync('.principal-views/architecture.canvas', 'utf8'));
          
          console.log('📊 Architecture Statistics:');
          console.log(\`   Nodes: \${canvas.nodes.length}\`);
          console.log(\`   Edges: \${canvas.edges.length}\`);
          console.log(\`   Version: \${canvas.pv.version}\`);
          console.log('');
          console.log('🔗 Node Connections:');
          canvas.edges.forEach(edge => {
            console.log(\`   \${edge.fromNode} → \${edge.toNode} (\${edge.pv.edgeType})\`);
          });
          "
          
          # Create node list
          nodejs -e "
          const fs = require('fs');
          const canvas = JSON.parse(fs.readFileSync('.principal-views/architecture.canvas', 'utf8'));
          
          let nodeList = '# Architecture Nodes\n\n';
          canvas.nodes.forEach(node => {
            nodeList += \`## \${node.id}\n`;
            nodeList += \`- **Type**: \${node.pv.nodeType}\n`;
            nodeList += \`- **Position**: (\${node.x}, \${node.y})\n`;
            nodeList += \`- **Content**: \${node.text.replace(/#/g, '').replace(/\n+/g, ' ').trim()}\n\n`;
          });
          
          fs.writeFileSync('docs/architecture/nodes.md', nodeList);
          "
          
      - name: Generate Component Library Documentation
        run: |
          echo "📚 Documenting component library..."
          
          # Create component documentation
          nodejs -e "
          const fs = require('fs');
          const yaml = require('js-yaml');
          
          // Simple YAML parser for node components
          const libraryContent = fs.readFileSync('.principal-views/library.yaml', 'utf8');
          const lines = libraryContent.split('\\n');
          
          let nodeComponents = {};
          let edgeComponents = {};
          let currentSection = '';
          let currentKey = '';
          
          lines.forEach(line => {
            if (line.startsWith('nodeComponents:')) {
              currentSection = 'nodes';
            } else if (line.startsWith('edgeComponents:')) {
              currentSection = 'edges';
            } else if (line.match(/^  \\w+:/)) {
              currentKey = line.trim().replace(':', '');
              if (currentSection === 'nodes') {
                nodeComponents[currentKey] = {};
              } else {
                edgeComponents[currentKey] = {};
              }
            } else if (line.match(/^    \\w+:/) && currentKey) {
              const [key, ...valueParts] = line.trim().split(':');
              const value = valueParts.join(':').trim().replace(/['\"]/g, '');
              if (currentSection === 'nodes') {
                nodeComponents[currentKey][key] = value;
              } else {
                edgeComponents[currentKey][key] = value;
              }
            }
          });
          
          let componentDoc = '# Component Library Reference\\n\\n';
          
          componentDoc += '## Node Components\\n\\n';
          Object.entries(nodeComponents).forEach(([key, component]) => {
            componentDoc += \`### \${key}\\n\`;
            componentDoc += \`- **Description**: \${component.description || 'N/A'}\\n\`;
            componentDoc += \`- **Color**: \${component.color || 'N/A'}\\n\`;
            componentDoc += \`- **Tags**: \${component.tags ? component.tags.join(', ') : 'N/A'}\\n\\n\`;
          });
          
          componentDoc += '## Edge Components\\n\\n';
          Object.entries(edgeComponents).forEach(([key, component]) => {
            componentDoc += \`### \${key}\\n\`;
            componentDoc += \`- **Description**: \${component.description || 'N/A'}\\n\`;
            componentDoc += \`- **Style**: \${component.style || 'N/A'}\\n\`;
            componentDoc += \`- **Color**: \${component.color || 'N/A'}\\n\`;
            componentDoc += \`- **Tags**: \${component.tags ? component.tags.join(', ') : 'N/A'}\\n\\n\`;
          });
          
          fs.writeFileSync('docs/architecture/components.md', componentDoc);
          "
          
      - name: Create Architecture Diagram Summary
        run: |
          echo "📈 Creating architecture summary..."
          
          cat > docs/architecture/summary.json << 'EOF'
          {
            "model": "Grok-1",
            "version": "1.0.0",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "components": {
              "nodes": 11,
              "edges": 10,
              "node_types": [
                "user_input", "tokenizer", "language_model", 
                "transformer", "attention", "moe_layer", 
                "checkpoint", "inference_runner", "model_output"
              ],
              "edge_types": [
                "data_flow", "token_flow", "model_connection", 
                "attention_flow", "expert_routing", "execution_flow"
              ]
            },
            "technical_specs": {
              "parameters": "314B",
              "architecture": "Mixture of 8 Experts",
              "layers": 64,
              "attention_heads": {
                "query": 48,
                "key_value": 8
              },
              "embedding_size": 6144,
              "max_sequence_length": 8192,
              "framework": "JAX"
            }
          }
          EOF
          
      - name: Validate Generated Documentation
        run: |
          echo "🔍 Validating generated documentation..."
          
          # Check if all files were created
          ls -la docs/architecture/
          
          # Validate JSON file
          nodejs -e "
          try {
            const summary = JSON.parse(require('fs').readFileSync('docs/architecture/summary.json', 'utf8'));
            console.log('✅ Summary JSON is valid');
            console.log(\`   Generated: \${summary.generated_at}\`);
            console.log(\`   Components: \${summary.components.nodes} nodes, \${summary.components.edges} edges\`);
          } catch (e) {
            console.error('❌ Invalid JSON:', e.message);
            process.exit(1);
          }
          "
          
      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-architecture-docs
          path: docs/architecture/
          retention-days: 30
          
      - name: Upload Principal View Configuration
        uses: actions/upload-artifact@v4
        with:
          name: principal-view-config
          path: .principal-views/
          retention-days: 30
          
      - name: Create Archive of Configuration
        run: |
          echo "📦 Creating configuration archive..."
          tar -czf grok-1-principal-view.tar.gz .principal-views/ .github/workflows/
          
      - name: Upload Configuration Archive
        uses: actions/upload-artifact@v4
        with:
          name: grok-1-principal-view-archive
          path: grok-1-principal-view.tar.gz
          retention-days: 30
          
      - name: Summary
        run: |
          echo "🎉 Architecture documentation generated successfully!"
          echo ""
          echo "📋 Generated Files:"
          echo "   • docs/architecture/README.md - Architecture overview"
          echo "   • docs/architecture/nodes.md - Node details"
          echo "   • docs/architecture/components.md - Component reference"
          echo "   • docs/architecture/summary.json - Technical summary"
          echo ""
          echo "📦 Artifacts Created:"
          echo "   • grok-architecture-docs - Complete documentation"
          echo "   • principal-view-config - Raw configuration files"
          echo "   • grok-1-principal-view-archive - Complete setup archive"